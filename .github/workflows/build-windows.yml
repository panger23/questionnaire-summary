name: 构建 Windows 免安装包

on:
  workflow_dispatch:        # 也可以在 GitHub 页面手动点运行
  push:
    tags: ["v*"]            # 打 tag 就自动构建

permissions:
  contents: write   # 发布 Release 需要

jobs:
  build-windows:
    name: Windows 免安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: pyinstaller --clean --noconfirm packaging/app.spec

      - name: 冒烟测试（打包后的程序能不能起来并响应首页）
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\LuShen\LuShen.exe" `
            -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8799/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch { }
          if (-not $ok) { Write-Error "打包后的程序没能正常启动"; exit 1 }
          Write-Host "冒烟测试通过：首页返回 200"

      - name: 组装发布包
        shell: pwsh
        run: |
          $root = "dist\发布"
          $app  = Join-Path $root "LuShen"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item "dist\LuShen\*" $app -Recurse
          Copy-Item "packaging\使用说明.txt" (Join-Path $app "README.txt")

          # 双击启动脚本（文件名用 ASCII，避免压缩包解压后中文乱码）
          $bat = @"
          @echo off
          chcp 65001 >nul
          cd /d "%~dp0"
          echo Starting LuShen ... keep this window open; closing it stops the service.
          "LuShen.exe"
          if errorlevel 1 pause
          "@
          Set-Content -Path (Join-Path $app "start.bat") -Value $bat -Encoding ascii

          Compress-Archive -Path "dist\发布\LuShen" -DestinationPath "dist\LuShen-windows.zip" -CompressionLevel Optimal -Force

      - name: 制作 90MB 分卷（微信/邮件单文件有大小限制）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\分卷" | Out-Null
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "C:\Program Files (x86)\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { throw "找不到 7z.exe" }
          & $sevenZip a -v90m -mx=5 "dist\分卷\LuShen-windows.7z" "dist\发布\LuShen" | Select-Object -Last 3
          Get-ChildItem "dist\分卷" | ForEach-Object {
            Write-Host ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: 显示体积
        shell: pwsh
        run: |
          $zip = Get-Item "dist\LuShen-windows.zip"
          Write-Host ("压缩包：{0:N1} MB" -f ($zip.Length / 1MB))
          $dir = (Get-ChildItem "dist\发布\LuShen" -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("解压后：{0:N1} MB" -f ($dir / 1MB))

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LuShen-windows
          path: |
            dist/LuShen-windows.zip
            dist/分卷/*.7z.*
          retention-days: 60

      - name: 发布到 Release（免登录直接下载）
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## 鲁审 · 汇卷 $tag

          Windows 免安装版。解压后双击 `start.bat` 即可使用。

          - 完全离线可用，不需要安装 Python / Java
          - 解压后双击 `start.bat`，Chrome 会自动打开操作页面
          - 首次运行如遇「未知发布者」提示，点「更多信息 → 仍要运行」
          - 使用说明见压缩包内的 `README.txt`

          ### 分卷版（单个文件 90MB，适合微信/邮件传输）

          如果一次传输不能超过 100MB，请下载 `LuShen-windows.7z.001`、`.002`……
          全部放到同一个文件夹后，用 **7-Zip** 或 **WinRAR** 右键点 `.001` → 提取即可。

          > 只有一个文件 `.zip`（175MB），适合 U 盘/内网共享盘传输。
          "@
          $assets = @("dist\LuShen-windows.zip")
          $assets += Get-ChildItem "dist\分卷\*.7z.*" | ForEach-Object { $_.FullName }
          Write-Host "将上传：$($assets.Count) 个文件"
          gh release create $tag @assets --title "鲁审 · 汇卷 $tag" --notes $notes --latest
