name: 仓库守卫与测试

on:
  push:
  pull_request:

jobs:
  no-data-files:
    name: 禁止问卷数据入库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查仓库里有没有 PDF / 图片 / 表格 / 文档
        run: |
          hits=$(git ls-files | grep -Ei '\.(pdf|jpe?g|png|webp|bmp|tiff?|xlsx?|csv|docx?|pptx?)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::仓库里出现了数据文件，请移出并执行 git rm --cached <文件>"
            echo "$hits"
            exit 1
          fi
          echo "OK：仓库中没有数据文件"
      - name: 检查有没有泄漏密钥
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}' -- . ':!*.md' ; then
            echo "::error::疑似把 API Key 提交进仓库了"
            exit 1
          fi
          echo "OK：没有明文密钥"

  tests:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装测试所需依赖
        run: python -m pip install -q numpy Pillow openai
      - name: 跑测试
        run: python -m unittest discover -s tests -v
